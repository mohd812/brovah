<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brovah</title>
  <meta name="description" content="Brovah — something new is on the way.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x25C6;</text></svg>">
  <style>
    :root {
      --bg: #0b0d10;
      --surface: #14171c;
      --text: #f2f4f7;
      --muted: #9aa3af;
      --accent: #e8b84b;
      --border: #242932;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf9f6;
        --surface: #ffffff;
        --text: #16181d;
        --muted: #5c6470;
        --accent: #b8860b;
        --border: #e6e2d8;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .mark {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .tagline {
      margin-top: 1rem;
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      color: var(--muted);
      max-width: 34ch;
      line-height: 1.5;
    }
    .cta {
      margin-top: 2.5rem;
      display: inline-block;
      padding: 0.8rem 1.8rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      transition: border-color 0.2s ease;
    }
    .cta:hover { border-color: var(--accent); }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">&#x25C6;</div>
    <h1>Brovah</h1>
    <p class="tagline">Something new is on the way. We're building quietly &mdash; check back soon.</p>
    <a class="cta" href="mailto:hello@brovah.com">Get in touch</a>
  </main>
  <footer>&copy; 2026 Brovah. All rights reserved.</footer>
</body>
</html>
